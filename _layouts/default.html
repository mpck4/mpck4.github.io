<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>

{% include sidebar.html %}

<div class="main">
  <div class="topbar">
    <span class="crumb"><a href="{{ '/' | relative_url }}">~/</a> <b>{{ page.title | default: 'home' | downcase }}</b></span>
    <span id="clock">--:--</span>
  </div>
  <div class="content">
    {{ content }}
  </div>
</div>

<script>
  // theme toggle with persistence
  (function(){
    var btn=document.getElementById('theme-toggle');
    if(btn) btn.addEventListener('click',function(){
      var cur=document.documentElement.getAttribute('data-theme')==='gray'?'black':'gray';
      if(cur==='gray') document.documentElement.setAttribute('data-theme','gray');
      else document.documentElement.removeAttribute('data-theme');
      try{localStorage.setItem('theme',cur);}catch(e){}
    });
    function tick(){var c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
    tick();setInterval(tick,10000);
  })();
</script>
</body>
</html>
