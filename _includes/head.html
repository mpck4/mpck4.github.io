<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#000000">

<title>
  {% if page.title and page.title != site.title %}{{ page.title }} · {{ site.author.name }}{% else %}{{ site.title }}{% endif %}
</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<script>
  // apply saved theme before paint to avoid flash; default = black
  (function(){try{var t=localStorage.getItem('theme');if(t==='gray')document.documentElement.setAttribute('data-theme','gray');}catch(e){}})();
</script>

{% feed_meta %}
